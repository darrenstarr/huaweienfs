name: release

# Fires when you push a tag matching v*, e.g. `git tag v0.1.1 && git push origin v0.1.1`.
# Builds the .deb and creates a GitHub Release with the artefact attached.
# Manual-only by design: cutting a release is a deliberate human act,
# not something every merge to main triggers.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    name: build .deb and publish release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dpkg-dev + lintian
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev debhelper dkms lintian

      - name: Build the .deb
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artefacts into ./dist/
        run: |
          mkdir -p dist
          cp ../enfs-dkms_*.deb ../enfs-dkms_*.changes ../enfs-dkms_*.buildinfo dist/ 2>/dev/null || true
          ls -lh dist/

      - name: Create release with auto-generated notes
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
