name: release

# Fires when you push a tag matching v*, e.g. `git tag v0.1.1 && git push origin v0.1.1`.
# Builds the .deb and creates a GitHub Release with the artefact attached.
# Manual-only by design: cutting a release is a deliberate human act,
# not something every merge to main triggers.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    name: build .deb and publish release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install dpkg-dev + lintian + dh-dkms
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev debhelper dh-dkms dkms lintian pandoc

      # As of #16 the .deb no longer bundles vendor/ubuntu-X.Y/ kernel
      # source; it's fetched from the user's /usr/src/linux-source-*
      # at install time. So the release build no longer needs any
      # linux-source-* package or the per-target vendor cache.

      - name: Build the .deb
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artefacts into ./dist/
        run: |
          mkdir -p dist
          cp ../enfs-dkms_*.deb ../enfs-dkms_*.changes ../enfs-dkms_*.buildinfo dist/ 2>/dev/null || true
          ls -lh dist/

      - name: Create release with auto-generated notes
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Supported targets

            | Ubuntu            | Kernel series | amd64                                       | arm64                                       |
            |-------------------|---------------|---------------------------------------------|---------------------------------------------|
            | **26.04 LTS**     | 7.0.x         | ✓ full E2E (build + apt install + mount)    | ✓ build + DKMS install on real arm64 in CI  |
            | **24.04 LTS HWE** | 6.14.x        | ✓ full E2E (build + apt install + mount)    | ✓ build + DKMS install on real arm64 in CI  |
            | **24.04 LTS GA**  | 6.8.x         | ✓ build + apt install + module load          | ✓ build + DKMS install on real arm64 in CI  |

            **arm64 status, more precisely:** every PR runs
            `apt install ./enfs-dkms_*_all.deb` on a real arm64
            GitHub Actions runner (Ampere Altra) and confirms
            `dkms status -m enfs` shows the modules as `installed`.
            `modprobe enfs` and a real multipath mount on arm64
            hardware are not part of CI (hosted runners are sandboxed
            VMs that won't load foreign-built modules) — that
            verification happens out-of-band on a dedicated arm64
            test VM.

            The .deb is `Architecture: all` — DKMS does the per-kernel,
            per-arch compile on the user's machine using their installed
            `linux-headers-*` and `linux-source-*`. One .deb works on
            amd64 *and* arm64.

            As of #16 the package no longer bundles ~30 MB of stock
            kernel source; it `Depends: linux-source` and pulls the
            tarball at install time. Build is fully offline-capable
            once the source package is cached locally.

            ## Install

            ```bash
            sudo apt install ./enfs-dkms_*_all.deb
            # On HWE kernels (e.g. 6.14 on 24.04) you may also need:
            #   sudo apt install linux-source-6.14.0
            sudo reboot                # required so DKMS modules load at boot
            sudo modprobe enfs
            ```

            See [`docs/user/00-quickstart.md`](https://github.com/darrenstarr/huaweienfs/blob/main/docs/user/00-quickstart.md)
            for the 3-minute zero-to-mounted walkthrough.

            ---

            ## What's changed
