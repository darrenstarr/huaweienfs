name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 6.8 + 6.14 against Ubuntu 24.04 (noble) — public runner.
  # noble has both kernels in the archive, so a single runner OS covers
  # the whole 24.04 LTS matrix.
  # 6.11 is intentionally not in the matrix until vendor/ubuntu-6.11 +
  # patches/ubuntu-6.11 land.
  build-noble:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-6.8
            kver-prefix: "6.8.0"
            headers: "linux-headers-generic"
          - target: ubuntu-6.14
            kver-prefix: "6.14.0"
            headers: "linux-headers-6.14.0-37-generic"
    steps:
      - uses: actions/checkout@v6

      - name: Install build deps + matching kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc kmod cpio flex bison \
              libssl-dev libelf-dev zstd dwarves
          sudo apt-get install -y ${{ matrix.headers }}

      - name: Pick a real KVER from installed headers
        id: kver
        run: |
          KVER=$(ls /lib/modules/ | grep "^${{ matrix.kver-prefix }}" | head -1)
          if [ -z "$KVER" ]; then
            echo "::error::No installed headers match ${{ matrix.kver-prefix }}.*"
            ls /lib/modules/
            exit 1
          fi
          echo "kver=$KVER" >> "$GITHUB_OUTPUT"
          echo "Using KVER=$KVER"

      - name: Port source tree
        run: make port TARGET=${{ matrix.target }}

      - name: Build modules
        run: make modules TARGET=${{ matrix.target }} KVER=${{ steps.kver.outputs.kver }}

      - name: Confirm all six modules linked
        run: |
          set -e
          for ko in src/sunrpc.ko src/nfs.ko src/fs/nfs/nfsv3.ko \
                    src/fs/lockd/lockd.ko src/fs/nfs_common/nfs_acl.ko \
                    src/fs/nfs/enfs/enfs.ko; do
            [ -f "$ko" ] || { echo "::error::missing $ko"; exit 1; }
            ls -lh "$ko"
          done

  # 7.0 needs Ubuntu 26.04 ("resolute"), which doesn't have a public
  # GitHub Actions runner yet — use the official 26.04 container on an
  # ubuntu-24.04 runner.
  build-resolute:
    name: build (ubuntu-7.0)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    steps:
      - uses: actions/checkout@v6

      - name: Install build deps + 7.0 headers
        run: |
          apt-get update
          apt-get install -y build-essential bc kmod cpio flex bison \
              libssl-dev libelf-dev zstd dwarves make \
              linux-headers-generic

      - name: Pick a real KVER from installed headers
        id: kver
        run: |
          KVER=$(ls /lib/modules/ | grep "^7\." | head -1)
          if [ -z "$KVER" ]; then
            echo "::error::No 7.x headers installed"
            ls /lib/modules/
            exit 1
          fi
          echo "kver=$KVER" >> "$GITHUB_OUTPUT"
          echo "Using KVER=$KVER"

      - name: Port source tree
        run: make port TARGET=ubuntu-7.0

      - name: Build modules
        run: make modules TARGET=ubuntu-7.0 KVER=${{ steps.kver.outputs.kver }}

      - name: Confirm all six modules linked
        run: |
          set -e
          for ko in src/sunrpc.ko src/nfs.ko src/fs/nfs/nfsv3.ko \
                    src/fs/lockd/lockd.ko src/fs/nfs_common/nfs_acl.ko \
                    src/fs/nfs/enfs/enfs.ko; do
            [ -f "$ko" ] || { echo "::error::missing $ko"; exit 1; }
            ls -lh "$ko"
          done

  # aarch64 cross-compile against Ubuntu 24.04 ARM64 kernel headers.
  # Hardware-emulated arm64 builds (under TCG) take 4-8 hours; cross-
  # compile finishes in 2-3 minutes. We don't try to *load* the
  # modules — that requires a real arm64 kernel, which we test
  # separately on enfs-dev-24-arm64.
  build-arm64-cross:
    name: build (${{ matrix.target }} arm64 cross)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-6.8
            kver-prefix: "6.8.0"
          - target: ubuntu-6.14
            kver-prefix: "6.14.0"
    steps:
      - uses: actions/checkout@v6

      - name: Enable arm64 apt sources + install cross toolchain
        run: |
          set -e
          # Restrict the existing amd64 sources so dpkg --add-architecture
          # arm64 doesn't try to fetch arm64 versions of every amd64 package.
          sudo sed -i 's|^Types: deb$|Types: deb\nArchitectures: amd64|' \
              /etc/apt/sources.list.d/ubuntu.sources
          sudo dpkg --add-architecture arm64
          # Add Ubuntu Ports archive (where arm64 packages live) — separate
          # mirror from archive.ubuntu.com which only carries amd64/i386.
          sudo tee /etc/apt/sources.list.d/arm64-ports.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y build-essential bc kmod cpio flex bison \
              libssl-dev libelf-dev zstd dwarves make \
              gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Install arm64 kernel headers
        run: |
          set -e
          if [ "${{ matrix.target }}" = "ubuntu-6.8" ]; then
              sudo apt-get install -y linux-headers-generic:arm64
          else
              # 6.14 is HWE — pick the same -37 ABI we test on amd64 for parity
              sudo apt-get install -y linux-headers-6.14.0-37-generic:arm64
          fi

      - name: Pick a real KVER from installed arm64 headers
        id: kver
        run: |
          # Headers install under /usr/src not /lib/modules for foreign arch
          KVER=$(ls /usr/src/ | grep "^linux-headers-${{ matrix.kver-prefix }}.*-generic$" | head -1 | sed 's|^linux-headers-||')
          if [ -z "$KVER" ]; then
            echo "::error::No arm64 headers found matching ${{ matrix.kver-prefix }}.*"
            ls /usr/src/
            exit 1
          fi
          echo "kver=$KVER" >> "$GITHUB_OUTPUT"
          echo "kdir=/usr/src/linux-headers-$KVER" >> "$GITHUB_OUTPUT"
          echo "Using KVER=$KVER  KDIR=/usr/src/linux-headers-$KVER"

      - name: Rebuild host build tools (fixdep, genksyms, modpost) for amd64
        run: |
          # The linux-headers-...-generic:arm64 package ships several
          # host-side build tools as aarch64 ELFs which won't run on
          # the amd64 CI runner ("Exec format error"). Delete the
          # arm64 copies so make has to rebuild them via HOSTCC
          # (= amd64 gcc on the runner).
          K=${{ steps.kver.outputs.kdir }}
          sudo rm -f "$K"/scripts/basic/fixdep \
                     "$K"/scripts/genksyms/genksyms \
                     "$K"/scripts/genksyms/*.o \
                     "$K"/scripts/mod/modpost \
                     "$K"/scripts/mod/*.o
          sudo make -C "$K" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
              scripts_basic
          sudo make -C "$K" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
              prepare
          file "$K"/scripts/basic/fixdep \
               "$K"/scripts/genksyms/genksyms \
               "$K"/scripts/mod/modpost

      - name: Port source tree
        run: make port TARGET=${{ matrix.target }}

      - name: Cross-build modules for arm64
        run: |
          make modules \
            TARGET=${{ matrix.target }} \
            KVER=${{ steps.kver.outputs.kver }} \
            KDIR=${{ steps.kver.outputs.kdir }} \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu-

      - name: Confirm all six modules linked + are aarch64
        run: |
          set -e
          for ko in src/sunrpc.ko src/nfs.ko src/fs/nfs/nfsv3.ko \
                    src/fs/lockd/lockd.ko src/fs/nfs_common/nfs_acl.ko \
                    src/fs/nfs/enfs/enfs.ko; do
            [ -f "$ko" ] || { echo "::error::missing $ko"; exit 1; }
            file "$ko" | grep -q "ELF 64-bit LSB.*aarch64" \
                || { echo "::error::$ko is not aarch64"; file "$ko"; exit 1; }
            ls -lh "$ko"
          done

  # The .deb itself doesn't need a kernel build — it's the DKMS source
  # tarball + control files. dpkg-buildpackage runs lintian afterwards.
  build-deb:
    name: build .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dpkg-dev + lintian + dh-dkms
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev debhelper dh-dkms dkms lintian
      - name: Build the .deb
        run: dpkg-buildpackage -us -uc -b
      - name: Collect .deb into workspace (upload-artifact disallows ..)
        run: |
          mkdir -p dist
          cp ../enfs-dkms_*.deb dist/
          ls -lh dist/
      - name: Stash artefact for inspection
        uses: actions/upload-artifact@v7
        with:
          name: enfs-dkms-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
