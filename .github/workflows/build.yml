name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 6.8 + 6.14 against Ubuntu 24.04 (noble) — public runner.
  # noble has both kernels in the archive, so a single runner OS covers
  # the whole 24.04 LTS matrix.
  # 6.11 is intentionally not in the matrix until vendor/ubuntu-6.11 +
  # patches/ubuntu-6.11 land.
  build-noble:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-6.8
            kver-prefix: "6.8.0"
            headers: "linux-headers-generic"
            linux_source: "linux-source-6.8.0"
          - target: ubuntu-6.14
            kver-prefix: "6.14.0"
            headers: "linux-headers-6.14.0-37-generic"
            linux_source: "linux-source-6.14.0"
    steps:
      - uses: actions/checkout@v6

      - name: Install build deps + matching kernel headers + source
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc kmod cpio flex bison \
              libssl-dev libelf-dev zstd dwarves bzip2
          sudo apt-get install -y ${{ matrix.headers }}
          # #16: vendor materialisation now reads the linux-source-X.Y.Z
          # tarball from /usr/src/, not the internet. Install the matching
          # package here.
          sudo apt-get install -y ${{ matrix.linux_source }}

      - name: Cache fetched Ubuntu kernel source
        uses: actions/cache@v4
        with:
          path: ~/.cache/enfs-vendor
          key: enfs-vendor-${{ matrix.target }}-${{ hashFiles(format('vendor/{0}/UPSTREAM-REVISION', matrix.target)) }}

      - name: Pick a real KVER from installed headers
        id: kver
        run: |
          KVER=$(ls /lib/modules/ | grep "^${{ matrix.kver-prefix }}" | head -1)
          if [ -z "$KVER" ]; then
            echo "::error::No installed headers match ${{ matrix.kver-prefix }}.*"
            ls /lib/modules/
            exit 1
          fi
          echo "kver=$KVER" >> "$GITHUB_OUTPUT"
          echo "Using KVER=$KVER"

      - name: Port source tree
        run: make port TARGET=${{ matrix.target }}

      - name: Build modules
        run: make modules TARGET=${{ matrix.target }} KVER=${{ steps.kver.outputs.kver }}

      - name: Confirm all six modules linked
        run: |
          set -e
          for ko in src/sunrpc.ko src/nfs.ko src/fs/nfs/nfsv3.ko \
                    src/fs/lockd/lockd.ko src/fs/nfs_common/nfs_acl.ko \
                    src/fs/nfs/enfs/enfs.ko; do
            [ -f "$ko" ] || { echo "::error::missing $ko"; exit 1; }
            ls -lh "$ko"
          done

  # 7.0 needs Ubuntu 26.04 ("resolute"), which doesn't have a public
  # GitHub Actions runner yet — use the official 26.04 container on an
  # ubuntu-24.04 runner.
  build-resolute:
    name: build (ubuntu-7.0)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    steps:
      - uses: actions/checkout@v6

      - name: Install build deps + 7.0 headers + source
        run: |
          apt-get update
          apt-get install -y build-essential bc kmod cpio flex bison \
              libssl-dev libelf-dev zstd dwarves make bzip2 \
              linux-headers-generic
          # #16: vendor materialisation reads /usr/src/linux-source-7.0.0.tar.*
          apt-get install -y linux-source-7.0.0

      - name: Cache fetched Ubuntu kernel source
        uses: actions/cache@v4
        with:
          path: ~/.cache/enfs-vendor
          key: enfs-vendor-ubuntu-7.0-${{ hashFiles('vendor/ubuntu-7.0/UPSTREAM-REVISION') }}

      - name: Pick a real KVER from installed headers
        id: kver
        run: |
          KVER=$(ls /lib/modules/ | grep "^7\." | head -1)
          if [ -z "$KVER" ]; then
            echo "::error::No 7.x headers installed"
            ls /lib/modules/
            exit 1
          fi
          echo "kver=$KVER" >> "$GITHUB_OUTPUT"
          echo "Using KVER=$KVER"

      - name: Port source tree
        run: make port TARGET=ubuntu-7.0

      - name: Build modules
        run: make modules TARGET=ubuntu-7.0 KVER=${{ steps.kver.outputs.kver }}

      - name: Confirm all six modules linked
        run: |
          set -e
          for ko in src/sunrpc.ko src/nfs.ko src/fs/nfs/nfsv3.ko \
                    src/fs/lockd/lockd.ko src/fs/nfs_common/nfs_acl.ko \
                    src/fs/nfs/enfs/enfs.ko; do
            [ -f "$ko" ] || { echo "::error::missing $ko"; exit 1; }
            ls -lh "$ko"
          done

  # aarch64 native build on GitHub-hosted Ampere Altra runners
  # (ubuntu-24.04-arm). Same install + make flow as the amd64 jobs;
  # finishes in ~2 min instead of the 20-50 min the previous
  # QEMU+binfmt container needed.
  #
  # This proves the source compiles natively for arm64. On-target
  # *load* testing under a real running arm64 kernel is separate
  # (the runner is a sandboxed VM that doesn't let us modprobe
  # foreign-built modules); we run that on enfs-dev-24-arm64.
  build-arm64-native:
    name: build (${{ matrix.target }} arm64)
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-6.8
            kver-prefix: "6.8.0"
            headers: "linux-headers-generic"
            linux_source: "linux-source-6.8.0"
          - target: ubuntu-6.14
            kver-prefix: "6.14.0"
            headers: "linux-headers-6.14.0-37-generic"
            linux_source: "linux-source-6.14.0"
    steps:
      - uses: actions/checkout@v6

      - name: Install build deps + matching kernel headers + source
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc kmod cpio flex bison \
              libssl-dev libelf-dev zstd dwarves file bzip2
          sudo apt-get install -y ${{ matrix.headers }}
          # #16: vendor materialisation reads /usr/src/linux-source-X.Y.Z
          # — install the matching package.
          sudo apt-get install -y ${{ matrix.linux_source }}

      - name: Cache fetched Ubuntu kernel source
        uses: actions/cache@v4
        with:
          path: ~/.cache/enfs-vendor
          key: enfs-vendor-${{ matrix.target }}-${{ hashFiles(format('vendor/{0}/UPSTREAM-REVISION', matrix.target)) }}

      - name: Pick a real KVER from installed headers
        id: kver
        run: |
          KVER=$(ls /lib/modules/ | grep "^${{ matrix.kver-prefix }}" | head -1)
          if [ -z "$KVER" ]; then
            echo "::error::No installed headers match ${{ matrix.kver-prefix }}.*"
            ls /lib/modules/
            exit 1
          fi
          echo "kver=$KVER" >> "$GITHUB_OUTPUT"
          echo "Using KVER=$KVER (arm64)"

      - name: Port source tree
        run: make port TARGET=${{ matrix.target }}

      - name: Build modules
        run: make modules TARGET=${{ matrix.target }} KVER=${{ steps.kver.outputs.kver }}

      - name: Confirm all six modules linked + are aarch64
        run: |
          set -e
          for ko in src/sunrpc.ko src/nfs.ko src/fs/nfs/nfsv3.ko \
                    src/fs/lockd/lockd.ko src/fs/nfs_common/nfs_acl.ko \
                    src/fs/nfs/enfs/enfs.ko; do
            [ -f "$ko" ] || { echo "::error::missing $ko"; exit 1; }
            file "$ko" | grep -q "ELF 64-bit LSB.*aarch64" \
                || { echo "::error::$ko is not aarch64"; file "$ko"; exit 1; }
            ls -lh "$ko"
          done

      - name: Install dpkg-dev + dh-dkms and build .deb on arm64
        run: |
          sudo apt-get install -y dpkg-dev debhelper dh-dkms dkms lintian pandoc
          dpkg-buildpackage -us -uc -b
          ls -lh ../enfs-dkms_*.deb

      - name: dpkg install of the .deb (validates postinst on arm64)
        run: |
          # The .deb is Architecture: all so the same artefact already
          # built by the build-deb job covers arm64; running the install
          # here proves dh_dkms substitution + dkms add + dkms install
          # actually work on a real arm64 kernel with arm64 headers.
          sudo apt-get install -y ../enfs-dkms_*_all.deb
          sudo dkms status -m enfs
          ls /lib/modules/$(uname -r)/updates/dkms/ | sort

  # The .deb itself doesn't need a kernel build — it's the DKMS source
  # tarball + control files. dpkg-buildpackage runs lintian afterwards.
  #
  # As of #16 the .deb no longer bundles vendor/ubuntu-X.Y/ kernel
  # source — those are fetched from the user's /usr/src/linux-source-*
  # at install time by the DKMS PRE_BUILD hook. So this job no longer
  # needs any linux-source-* package, and no kernel-source cache.
  build-deb:
    name: build .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dpkg-dev + lintian + dh-dkms
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev debhelper dh-dkms dkms lintian pandoc
      - name: Build the .deb
        run: dpkg-buildpackage -us -uc -b
      - name: Collect .deb into workspace (upload-artifact disallows ..)
        run: |
          mkdir -p dist
          cp ../enfs-dkms_*.deb dist/
          ls -lh dist/
      - name: Stash artefact for inspection
        uses: actions/upload-artifact@v7
        with:
          name: enfs-dkms-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
